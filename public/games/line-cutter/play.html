<!doctype html><script src="/runtime/core/preferences.js"></script><script data-handheld-system src="/runtime/core/game-shell.js"></script>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="stylesheet" href="core/screen.css">
<canvas id="screen" width="240" height="160"></canvas>
<script>
// Observe the real game AudioContext without changing its implementation.
const NativeAudioContext = window.AudioContext || window.webkitAudioContext;
if (NativeAudioContext) {
  window.AudioContext = new Proxy(NativeAudioContext, { construct(Target, args) {
    const context = new Target(...args); window.handheldAudio = context; return context;
  }});
}
</script>
<script src="core/preferences.js"></script><script src="core/input.js"></script>
<script src="core/platform.js"></script>
<script src="core/sdk.js"></script>
<script src="core/controls.js"></script>
<script src="line-cutter.js"></script>
<script>
'use strict';
let game = null, frames = 0, started = performance.now(), host = null;

const report = { userAgent: navigator.userAgent, viewport: [innerWidth, innerHeight],
  canvas2d: !!document.getElementById('screen').getContext('2d'),
  webAudio: !!(window.AudioContext || window.webkitAudioContext), gamepad: !!navigator.getGamepads,
  state: 'picker', errors: [] };
try {
  report.visits = Number(localStorage.getItem('handheld_visits') || 0) + 1;
  localStorage.setItem('handheld_visits', String(report.visits));
  report.storage = localStorage.getItem('handheld_visits') === String(report.visits);
} catch(e) { report.storage = false; }
function publish() {
  report.state = game ? game.state : 'picker'; report.frames = frames;
  report.visibility=document.visibilityState; report.focused=document.hasFocus();
  report.elapsedSeconds = Math.round((performance.now() - started) / 100) / 10;
  report.canvas = game ? [game.width, game.height] : null;
  try { report.hasSavedRun=!!host.saves.get('run'); } catch(e) {}
  if (window.handheldAudio) {
    report.audioState = window.handheldAudio.state;
    report.audioTime = window.handheldAudio.currentTime;
    report.decodedTitle = game && game._debug('!!TITLE.buf');
    report.decodedMatch = game && game._debug('!!MATCH.buf');
  }
  fetch('/report', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(report) }).catch(() => {});
}
window.addEventListener('error', e => { report.errors.push(String(e.message).slice(0,300)); report.errors = report.errors.slice(-10); publish(); });
function play() {
  if (game) return;
  game = LineCutter.create({ canvas: document.getElementById('screen'), onFrame: () => frames++ });
  host.start(game); publish();
}
function picker() {
  if (!game) return;
  host.dispose();
  // Returning via navigation releases the game's AudioContext and keeps its localStorage saves.
  location.href = '/';
}
const platform = HandheldPlatform.createPlatform(window.HandheldPlatformOptions);
host = HandheldSDK.createGameHost({platform, gameId:'line-cutter',
  legacySaveKeys:{run:'linecutter_run'}, onExit:picker});
host.input.attachPointer(document.getElementById('screen'));
HandheldControls.createControls(host.input,'game');
addEventListener('pagehide',()=>host.dispose());
play(); setInterval(publish,5000); publish();
</script>
</html>
