<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="cubby-session" content="__ADULT_SESSION__">
<title>Cubby · Adult Wi-Fi setup</title>
<link rel="stylesheet" href="/adult/network.css"><script src="/adult/network.js" defer></script>
</head>
<body>
<main>
<header><span class="adult">ADULT SETUP</span><h1>Connect Cubby</h1><p id="intro">Internet is required to finish setup and get games and updates.</p></header>
<p id="simulation" hidden>SIMULATION · No real Wi-Fi changes. Test password: cubby-test</p>
<p id="status" role="status" aria-live="polite">Checking the connection…</p>
<section id="networks" aria-label="Available Wi-Fi networks"></section>
<section id="password-panel" hidden>
<h2 id="selected"></h2>
<label for="password">Wi-Fi password</label>
<input id="password" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="64">
<div id="keyboard" aria-label="Controller keyboard"></div>
</section>
<footer id="actions">
<button id="rescan">Find networks</button><button id="verify">Check internet</button>
<button id="connect" hidden>Connect</button><button id="back" hidden>Back to networks</button><button id="continue" hidden>Continue to Cubby</button>
<button id="cancel" hidden>Cancel</button><button id="updates" hidden>Cubby updates</button>
</footer>
<p class="controls">D-pad: move · A: choose · B: back · L/R: keyboard case · Start: connect</p>
</main>
</body></html>
