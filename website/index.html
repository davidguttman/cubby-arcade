<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Cubby Buddy — a handheld arcade for little players. Join the waitlist."><meta name="theme-color" content="#2a1f3d"><title>Cubby Buddy — a handheld for little players</title><link rel="stylesheet" href="/site/style.css"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" href="/site/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/site/apple-touch-icon.png"><script src="https://www.saasco.com/sdk/saasco-sdk.js" data-projectId="cmwdybu1l001lpsp73l6cljit" async></script><style>
.games a{position:relative}.games video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s;pointer-events:none}.games a.live video{opacity:1}
.hero-media{position:relative}.play{position:absolute;z-index:1;inset:0;margin:auto;width:104px;height:104px;border:0;border-radius:50%;background:linear-gradient(180deg,#ffd970,#ffab28);box-shadow:0 7px 0 #bf690e,0 16px 30px rgba(6,2,14,.5),inset 0 2px 0 rgba(255,255,255,.6);cursor:pointer;display:grid;place-items:center;transition:transform .15s}.play:hover{transform:scale(1.06)}.play svg{width:44px;height:44px;fill:#4a2a08;margin-left:6px}.play[hidden]{display:none}
.joined{margin:30px 0 18px;color:var(--honey);font-size:21px;font-weight:800}
.waitlist{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:30px 0 18px}
.email-input{flex:1 1 200px;min-height:60px;padding:0 20px;border-radius:18px;border:none;background:rgba(255,255,255,.1);color:var(--ink);font-size:16px;font-family:inherit;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12);outline:none}
.email-input::placeholder{color:var(--soft)}
.email-input:focus{box-shadow:inset 0 0 0 2px var(--honey)}
.hero-media{border-radius:28px;overflow:hidden;box-shadow:0 30px 60px rgba(6,2,14,.55),inset 0 1px 0 rgba(255,255,255,.1);transform:rotate(-1.5deg)}
.hero-media video{display:block;width:100%}
.games{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:0 40px 76px}
.games a{display:block;border-radius:18px;overflow:hidden;aspect-ratio:4/3;box-shadow:0 8px 20px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.07);transition:transform .18s,box-shadow .18s}
.games a:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(0,0,0,.5),0 0 0 2px rgba(255,201,77,.4)}
.games img{display:block;width:100%;height:100%;object-fit:cover}
.feature{margin:0 40px 76px;padding:40px 48px;border-radius:28px;background:var(--panel);box-shadow:0 16px 36px rgba(8,4,18,.4),inset 0 1px 0 rgba(255,255,255,.1)}
.feature h2{margin:16px 0 10px}
.feature p:not(.eyebrow){max-width:600px;color:var(--muted);font-size:17px;margin:0}
@media(max-width:900px){.hero-media{transform:none}}
@media(max-width:760px){.games{grid-template-columns:repeat(2,1fr);padding:0 20px 56px}.feature{margin:0 20px 56px;padding:28px 24px}}
</style></head>
<body><header><a class="brand" href="/"><svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><path class="logo-roof" d="M24 3.5 44 18.5V39a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V18.5Z"/><rect class="logo-door" x="11" y="20" width="26" height="18" rx="6"/><g class="logo-face"><circle cx="19" cy="27.5" r="2.4"/><circle cx="29" cy="27.5" r="2.4"/><path d="M19.5 32.5q4.5 3.4 9 0"/></g></svg><span>Cubby Arcade</span></a></header>
<main>
<section class="hero"><div class="hero-copy"><p class="eyebrow">Coming soon</p><h1>Cubby<br>Buddy.</h1><p class="intro">A handheld for little players. No words required.</p><form class="waitlist" action="/waitlist" method="post"><input class="email-input" type="email" name="email" placeholder="your@email.com" required><button class="button" type="submit">Join the waitlist <span>→</span></button></form><p class="note">Can't wait? <a href="/play">Try the web demo ↗</a> · <a href="/steam">Steam ↗</a></p></div>
<div class="hero-media"><button class="play" type="button" aria-label="Play" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg></button><video controls playsinline preload="metadata" poster="https://media.publit.io/file/0b695f0a-141c-47a6-b12a-5ff213b261ae.jpg"><source src="https://media.publit.io/file/cc12e938-57a1-4525-b856-2fe9b767323b.mp4" type="video/mp4"></video></div></section>
<section class="games" aria-label="Games on Cubby Buddy">
<a href="https://trailmix.cubbyarcade.com/"><img src="/site/trail-mix-poster.png" alt="Trail Mix"><video muted playsinline preload="none" src="https://media.publit.io/file/6c8b54db-994d-4952-8052-79e6393c5bdf.mp4" aria-hidden="true"></video></a>

</section>
<section class="feature"><p class="eyebrow">Your games</p><h2>Your agent. Your games.</h2><p>Tell it what to make. The game lands on the console.</p></section>
</main>
<footer><a class="brand" href="/"><svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><path class="logo-roof" d="M24 3.5 44 18.5V39a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V18.5Z"/><rect class="logo-door" x="11" y="20" width="26" height="18" rx="6"/><g class="logo-face"><circle cx="19" cy="27.5" r="2.4"/><circle cx="29" cy="27.5" r="2.4"/><path d="M19.5 32.5q4.5 3.4 9 0"/></g></svg><span>Cubby Arcade</span></a><p>A little space for a lot of play.</p><a href="/docs/game-authoring.html">For game makers ↗</a></footer><script>
// Waitlist: a Saasco soft identify (email only, no account id) makes the CRM contact, plus a Signed Up event.
// The email rides on the event too: Saasco's identify was failing (HTTP 500) on 2026-11-12.
document.querySelector('.waitlist').addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.currentTarget, email = form.email.value.trim();
  for (let i = 0; !window.saasco && i < 40; i++) await new Promise(r => setTimeout(r, 50));
  if (window.saasco) { window.saasco.identify({ email }); await window.saasco.track('Signed Up', { email }); }
  form.outerHTML = '<p class="joined">You\u2019re on the list.</p>';
});
</script><script>
// Hero video: starts paused on its poster with one big play button; playing brings sound and the normal controls
{ const v = document.querySelector('.hero-media video'), b = document.querySelector('.hero-media .play');
  v.controls = false; b.hidden = false;
  const go = () => { b.hidden = true; v.controls = true; };
  b.addEventListener('click', () => { go(); v.muted = false; v.play(); });
  v.addEventListener('play', go); }
</script><script>
// Game cards: a wave left to right, one at a time: a poster turns into a few seconds of its gameplay, then back, then the next card
{ const cards = [...document.querySelectorAll('.games a')], SHOW = 3300, FADE = 500, REST = 2000;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  let run = 0;
  const wave = async id => {
    while (id === run) {
      for (const a of cards) {
        if (id !== run) return;
        const v = a.querySelector('video'); v.currentTime = 0;
        try { await v.play(); } catch (e) { continue; }
        a.classList.add('live'); await wait(SHOW);
        a.classList.remove('live'); await wait(FADE); v.pause();
      }
      await wait(REST);
    } };
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches && 'IntersectionObserver' in window)
    new IntersectionObserver(([e]) => { if (e.isIntersecting && !run) wave(run = Date.now()); else if (!e.isIntersecting) run = 0; }).observe(document.querySelector('.games')); }
</script></body></html>
