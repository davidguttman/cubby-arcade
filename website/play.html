<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cubby Arcade</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#d9d3c9">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" href="/site/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/site/apple-touch-icon.png">
<!-- Browser host only: the ordinary shared hub keeps all system behavior. -->
<iframe id="hub" title="Cubby Arcade" allow="autoplay; gamepad; fullscreen" hidden></iframe>
<script type="module">
import { mountShell } from '/site/vendor/cubby-buddy-shell/src/shell.js';
const TYPE = 'cubby:embed:v1', origin = location.origin, frame = document.getElementById('hub');
const send = data => frame.contentWindow?.postMessage({ type: TYPE, ...data }, origin);
let suspended = false, revealing = false, bootObserver;
const setActive = () => send({ event: 'active', active: !suspended && !document.hidden });
const adapter = {
  press: button => send({ event: 'button', button, down: true }),
  release: button => send({ event: 'button', button, down: false }),
  stop() { suspended = true; setActive(); },
  wake() { suspended = false; setActive(); }
};
const shell = mountShell({ content: frame, pixelWidth: 640, game: adapter });
frame.hidden = false;
function failed(error) {
  adapter.stop(); console.error('Browser shell could not start', error);
  const retry = document.createElement('button');
  retry.type = 'button'; retry.textContent = '↻'; retry.setAttribute('aria-label', 'Retry loading');
  retry.style.cssText = 'position:fixed;z-index:2;left:50%;bottom:24px;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;font-size:32px';
  retry.addEventListener('click', () => location.reload()); document.body.append(retry);
}
// Protocol readiness only acknowledges input. Actual hub UI (including its
// storage-error picture) must have rendered before the shared boot can leave.
function watchBoot() {
  if (revealing) return;
  bootObserver?.disconnect();
  const doc = frame.contentDocument;
  if (!doc?.documentElement) return;
  const painted = () => {
    if (!doc.querySelector('#hub .view-tab, #hub .browser-storage-error')) return;
    revealing = true; bootObserver?.disconnect();
    shell.ready().then(ok => { if (!ok) failed(new Error('Shell resources did not load')); });
  };
  bootObserver = new MutationObserver(painted);
  bootObserver.observe(doc.documentElement, { childList: true, subtree: true });
  painted();
}
addEventListener('message', e => {
  if (e.origin !== origin || e.source !== frame.contentWindow || !e.data || e.data.type !== TYPE) return;
  if (e.data.event === 'ready') { setActive(); watchBoot(); }
  else if (e.data.event === 'exit') { adapter.press('select'); adapter.release('select'); }
});
// Keep the screen's keyboard focus when the surrounding plastic is touched.
document.addEventListener('pointerdown', e => {
  if (e.target === frame || e.target.closest?.('button[aria-label="Retry loading"]')) return;
  e.preventDefault(); frame.focus();
}, true);
frame.addEventListener('load', () => { frame.focus(); watchBoot(); });
addEventListener('pagehide', e => { if (!e.persisted) { bootObserver?.disconnect(); shell.destroy(); } });
frame.src = '/native/index.html?embed=handheld&parentOrigin=' + encodeURIComponent(origin);
</script>
</html>
