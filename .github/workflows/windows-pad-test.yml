name: Windows controller repro
on:
  push:
    branches: [san/windows-pad-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pad:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ViGEmBus (virtual Xbox controller driver)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe -OutFile vigem.exe
          Start-Process .\vigem.exe -ArgumentList '/qn','/norestart' -Wait
          Get-PnpDevice -FriendlyName '*Virtual Gamepad Emulation*' | Format-Table -AutoSize
          # Windows Server lacks the Xbox 360 (XUSB) class driver that ViGEm's Xbox target needs; add it from the driver store if present.
          Get-ChildItem C:\Windows\System32\DriverStore\FileRepository -Recurse -Filter 'xusb*.inf' | ForEach-Object { $_.FullName; pnputil /add-driver $_.FullName /install }
      - name: Install vgamepad without its interactive driver installer, and playwright
        shell: pwsh
        run: |
          pip install playwright
          New-Item -ItemType Directory vg | Out-Null; Invoke-WebRequest https://files.pythonhosted.org/packages/06/a5/990701a89ea8d7528a269c2be1ba71d888de38a762a1b0f8d8eae4c2be62/vgamepad-0.2.0.tar.gz -OutFile vg/vgamepad-0.2.0.tar.gz
          tar -xzf vg/vgamepad-0.2.0.tar.gz -C vg
          "PYTHONPATH=$PWD\vg\vgamepad-0.2.0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Download released Windows app
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo ${{ github.repository }} --pattern 'CubbyArcade-win32-x64.zip' --dir dl
          Expand-Archive dl/CubbyArcade-win32-x64.zip -DestinationPath app
      - name: Desktop app with one virtual Xbox pad
        if: always()
        run: python tests/windows-pad/repro.py app desktop-one
      - name: Desktop app with one virtual PlayStation pad
        if: always()
        run: python tests/windows-pad/repro.py app desktop-one-ds4
      - name: Chrome with one virtual PlayStation pad
        if: always()
        run: python tests/windows-pad/repro.py app chrome-one-ds4
      - name: Desktop app with two virtual Xbox pads (second idle)
        if: always()
        run: python tests/windows-pad/repro.py app desktop-two
      - name: Chrome on play.cubbyarcade.com with one virtual Xbox pad
        if: always()
        run: python tests/windows-pad/repro.py app chrome-one
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-pad-evidence
          path: evidence
