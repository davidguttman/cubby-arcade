name: Cubby builds and releases
on:
  push:
    branches: [main, windows-desktop]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cubby-stable-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Plan one versioned release from this exact commit
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release_automation.py plan
  windows:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.7'
      - run: npm ci
      - name: Installer regression tests
        run: node --test tests/desktop_installer.cjs
      - name: Build portable Windows ZIP
        run: npm run desktop:build:windows
      - name: Exercise packaged Windows app
        timeout-minutes: 5
        run: ./desktop/windows-smoke.ps1
      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: CubbyArcade-windows-x64
          path: |
            dist/CubbyArcade-win32-x64.zip
            dist/CubbyArcade-win32-x64.zip.sha256
          if-no-files-found: error
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-evidence
          path: dist/windows-smoke
          if-no-files-found: warn
  linux:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.7'
      - name: Install native smoke dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgtk-3-0t64 libnss3 libasound2t64 libgbm1 dosfstools e2fsprogs
      - run: npm ci
      - name: Regression tests
        run: |
          node --test tests/*.cjs
          uv run python -m unittest discover -s tests -q
      - name: Production image filesystem audit regressions
        run: |
          command -v mkfs.vfat mkfs.ext4 debugfs
          uv run --with pyfatfs==1.1.0 --with setuptools==80.9.0 --with pyyaml==6.0.3 python -c 'from pyfatfs.PyFatFS import PyFatFS'
          PYTHONPATH=tests uv run --with pyfatfs==1.1.0 --with setuptools==80.9.0 --with pyyaml==6.0.3 python -m unittest test_production_image test_fat_image_replacement -v
      - name: Build portable Linux archive
        run: npm run desktop:build
      - name: Exercise packaged Linux app
        timeout-minutes: 5
        run: bash desktop/linux-smoke.sh
      - name: Build signed handheld update with the same product version
        if: needs.validate.outputs.release == 'true'
        env:
          CUBBY_DEVICE_SIGNING_KEY: ${{ secrets.CUBBY_DEVICE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keydir=$(mktemp -d "${RUNNER_TEMP}/cubby-signing.XXXXXX")
          trap 'rm -f "$keydir/private.pem" "$keydir/public.pem"; rmdir "$keydir"' EXIT
          test -n "$CUBBY_DEVICE_SIGNING_KEY" || { echo 'Missing CUBBY_DEVICE_SIGNING_KEY repository secret'; exit 1; }
          printf '%s\n' "$CUBBY_DEVICE_SIGNING_KEY" > "$keydir/private.pem"
          unset CUBBY_DEVICE_SIGNING_KEY
          openssl pkey -in "$keydir/private.pem" -pubout -out "$keydir/public.pem"
          cmp "$keydir/public.pem" rocknix/device/release-key.pem
          python3 release_automation.py device --directory dist/device --key "$keydir/private.pem"
      - name: Upload signed handheld update
        if: needs.validate.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CubbyArcade-device
          path: |
            dist/device/app.zip
            dist/device/manifest.json
            dist/device/manifest.json.sig
            dist/device/platform.zip
            dist/device/update.json
            dist/device/update.json.sig
          if-no-files-found: error
      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: CubbyArcade-linux-x64
          path: |
            dist/CubbyArcade-linux-x64.tar.gz
            dist/CubbyArcade-linux-x64.tar.gz.sha256
          if-no-files-found: error
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke-evidence
          path: dist/linux-smoke
          if-no-files-found: warn
  publish:
    needs: [validate, windows, linux]
    if: needs.validate.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: CubbyArcade-*
          merge-multiple: true
          path: dist/release
      - name: Publish all verified platforms, then advance signed handheld feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release_automation.py publish
