<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title></title>
<style>html,body{margin:0;height:100%;background:#101614;overflow:hidden;cursor:none}body{display:grid;place-items:center}canvas{width:480px;height:320px;image-rendering:pixelated}</style>
<canvas width="240" height="160" aria-label="Game library"></canvas><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let games=[],images=[],selected=0,last=[],controllerReady=false,error=false;
function play(){if(games[selected])location.href=games[selected].entrypoint}
function move(d){if(games.length)selected=(selected+d+games.length)%games.length}
addEventListener('keydown',e=>{if(['Enter','KeyZ','Space'].includes(e.code)){e.preventDefault();play()}if(['ArrowRight','ArrowDown'].includes(e.code))move(1);if(['ArrowLeft','ArrowUp'].includes(e.code))move(-1)});canvas.onclick=play;
fetch('/library').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{games=data;images=games.map(g=>{const image=new Image();image.src=g.artwork;return image})}).catch(()=>{error=true});
function draw(t){ctx.fillStyle='#101614';ctx.fillRect(0,0,240,160);const img=images[selected];if(img&&img.complete&&img.naturalWidth){ctx.drawImage(img,20,7,200,115);ctx.strokeStyle='#a7d07a';ctx.lineWidth=3;ctx.strokeRect(18,5,204,119);ctx.fillStyle='#a7d07a';ctx.beginPath();ctx.moveTo(115,136);ctx.lineTo(132,145);ctx.lineTo(115,154);ctx.fill();if(games.length>1){ctx.fillStyle='#edf3dc';ctx.beginPath();ctx.moveTo(8,60);ctx.lineTo(2,68);ctx.lineTo(8,76);ctx.fill();ctx.beginPath();ctx.moveTo(232,60);ctx.lineTo(238,68);ctx.lineTo(232,76);ctx.fill()}}else{ctx.strokeStyle=error?'#e5664b':'#a7d07a';ctx.lineWidth=4;ctx.strokeRect(85,54,70,50);ctx.beginPath();ctx.moveTo(85,72);ctx.lineTo(108,72);ctx.lineTo(114,80);ctx.lineTo(127,80);ctx.lineTo(133,72);ctx.lineTo(155,72);ctx.stroke()}
const p=navigator.getGamepads&&Array.from(navigator.getGamepads()).find(Boolean);if(p){const d=p.buttons.map(b=>b.pressed);if(!controllerReady){controllerReady=!d.some(Boolean)&&p.axes.every(a=>Math.abs(a)<0.5);last=d}else{if(d[0]&&!last[0]||d[9]&&!last[9])play();if(d[15]&&!last[15]||d[13]&&!last[13])move(1);if(d[14]&&!last[14]||d[12]&&!last[12])move(-1);last=d}}else{controllerReady=false;last=[]}requestAnimationFrame(draw)}requestAnimationFrame(draw);
fetch('/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:'picker',errors:[]})}).catch(()=>{});
</script></html>
