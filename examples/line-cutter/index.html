<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title></title>
<link rel="stylesheet" href="core/screen.css">
<div class="screen"><video src="trailer-handheld.webm" autoplay muted playsinline preload="auto"></video><canvas width="240" height="160" aria-label="Play"></canvas></div><script src="core/input.js"></script><script src="core/controls.js"></script><script>
const c=document.querySelector('canvas'),x=c.getContext('2d'),cover=new Image();cover.src='cover.svg';
const trailer=document.querySelector('video');

function publish(){fetch('/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:'attract',trailer:{time:trailer.currentTime,duration:trailer.duration,width:trailer.videoWidth,height:trailer.videoHeight,paused:trailer.paused,muted:trailer.muted,loop:true,readyState:trailer.readyState,error:trailer.error?trailer.error.code:null}})}).catch(()=>{})}
setInterval(publish,2000);
trailer.addEventListener('error',publish);
// Reopen the local file at the end; WPE's native loop seek can stall with
// some video streams. This also leaves start/back controls live during decoder startup.
trailer.addEventListener('ended',()=>{trailer.load();trailer.play().catch(()=>{})});
function play(){location.href='play.html'}
function back(){location.href='/'}
const input=HandheldInput.createInput({onAction:e=>{
  if(e.action==='confirm'||e.action==='pause')play();
  if(e.action==='back'||e.action==='exit')back();
}});
input.attachPointer(c);
HandheldControls.createControls(input,'title');
addEventListener('pagehide',()=>input.dispose());
function frame(t){x.clearRect(0,0,240,160);if(trailer.readyState<2&&cover.complete&&cover.naturalWidth)x.drawImage(cover,20,3,200,125);
x.fillStyle='#a7d07a';x.beginPath();x.arc(120,143,13+Math.sin(t/400),0,Math.PI*2);x.fill();x.fillStyle='#101614';x.beginPath();x.moveTo(116,135);x.lineTo(128,143);x.lineTo(116,151);x.fill();
requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
