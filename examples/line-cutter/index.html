<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title></title>
<style>html,body{margin:0;height:100%;background:#101614;overflow:hidden;cursor:none}body{display:grid;place-items:center}canvas{width:480px;height:320px;image-rendering:pixelated}</style>
<canvas width="240" height="160" aria-label="Play"></canvas><script>
const c=document.querySelector('canvas'),x=c.getContext('2d'),cover=new Image();cover.src='cover.svg';
let last=[],controllerReady=false,start=performance.now();
function play(){location.href='play.html'}
function back(){location.href='/'}
addEventListener('keydown',e=>{if(['Enter','Space','KeyZ'].includes(e.code)){e.preventDefault();play()}if(['Escape','KeyX'].includes(e.code))back()});c.onclick=play;
function frame(t){x.fillStyle='#101614';x.fillRect(0,0,240,160);if(cover.complete&&cover.naturalWidth)x.drawImage(cover,20,3,200,125);
// Silent looping illustration, not a recording or fake gameplay trailer.
const progress=((t-start)%3000)/3000,arrowX=190-progress*115;x.fillStyle='#edf3dc';x.fillRect(arrowX,60,30,2);x.beginPath();x.moveTo(arrowX,61);x.lineTo(arrowX+8,56);x.lineTo(arrowX+8,66);x.fill();
x.fillStyle='#a7d07a';x.beginPath();x.arc(120,143,13+Math.sin(t/400),0,Math.PI*2);x.fill();x.fillStyle='#101614';x.beginPath();x.moveTo(116,135);x.lineTo(128,143);x.lineTo(116,151);x.fill();
const p=navigator.getGamepads&&Array.from(navigator.getGamepads()).find(Boolean);if(p){const d=p.buttons.map(b=>b.pressed);if(!controllerReady){controllerReady=!d.some(Boolean)&&p.axes.every(a=>Math.abs(a)<0.5);last=d}else{if((d[0]&&!last[0])||(d[9]&&!last[9]))play();if(d[1]&&!last[1]||d[4]&&d[5])back();last=d}}else{controllerReady=false;last=[]}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
