# Static preview of the web export. Run `uv run python web.py build` on the host before start.
services:
  web:
    image: python:3.13-slim
    network_mode: bridge
    working_dir: /app
    volumes:
      - .:/app:ro
    command: python3 web.py serve --bind 0.0.0.0 --port 8080
    expose:
      - "8080"
